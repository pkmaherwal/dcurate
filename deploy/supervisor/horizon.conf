; /etc/supervisor/conf.d/dc-horizon.conf
; Runs the queue workers (fetch, ai, default) through Laravel Horizon.
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start dc-horizon
[program:dc-horizon]
process_name=%(program_name)s
command=php /var/www/dc/current/artisan horizon
user=www-data
autostart=true
autorestart=true
stopwaitsecs=200
redirect_stderr=true
stdout_logfile=/var/www/dc/shared/storage/logs/horizon.log
