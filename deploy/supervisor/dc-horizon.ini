; Horizon queue workers (fetch, ai, default) for the curation app.
; Install (as root), replacing the placeholders:
;   sed -e "s/__DOMAIN__/$DOMAIN/g" -e "s/__SITEUSER__/$SITEUSER/g" deploy/supervisor/dc-horizon.ini > /etc/supervisord.d/dc-horizon.ini
;   supervisorctl reread && supervisorctl update
[program:dc-horizon]
process_name=%(program_name)s
command=/usr/local/lsws/lsphp83/bin/php /home/__DOMAIN__/dc/artisan horizon
directory=/home/__DOMAIN__/dc
user=__SITEUSER__
environment=HOME="/home/__DOMAIN__"
autostart=true
autorestart=true
stopwaitsecs=200
redirect_stderr=true
stdout_logfile=/home/__DOMAIN__/dc/storage/logs/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
